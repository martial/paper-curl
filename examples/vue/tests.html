<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PaperCurl browser regressions</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bungee&display=swap"
    />
    <style>
      body {
        font: 15px system-ui;
        padding: 30px;
        background: #eae9e1;
        color: #273d39;
      }
      button {
        font: inherit;
        padding: 12px;
      }
      #results {
        white-space: pre-wrap;
        line-height: 1.7;
      }
      .fixture {
        width: 900px;
        height: 600px;
      }
      .fixture article {
        margin: 0;
        padding: 0;
        background: white;
      }
      .fixture img {
        display: block;
        width: 100%;
        height: 100%;
      }
      #proof {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      #proof canvas {
        width: 400px;
        border: 1px solid #999;
      }
      .fail {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <h1>PaperCurl browser regressions</h1>
    <p>
      Actual SVG snapshots and WebGL pixels. Start the asset server with
      <code>node scripts/browser-fixtures.mjs</code>, then run.
    </p>
    <button id="run">Run browser checks</button>
    <pre id="results" role="status">Ready.</pre>
    <div id="proof"></div>
    <div id="fixtures"></div>
    <script type="module" src="./tests.js"></script>
  </body>
</html>
