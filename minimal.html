<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaperCurl — edit this example</title>
    <link rel="stylesheet" href="paper-curl.css" />
    <style>
      body {
        margin: 0;
        background: #d4e0e3;
        color: #193f48;
        font-family: Georgia, serif;
      }
      #book {
        height: 80vh;
        min-height: 380px;
      }
      .page {
        padding: 42px;
        background: #faf9f2;
      }
      .cover {
        background: #245c66;
        color: white;
      }
      h1 {
        font-size: 62px;
        font-weight: normal;
        line-height: 1;
      }
      h2 {
        font-size: 38px;
        font-weight: normal;
      }
      p {
        font-size: 20px;
        line-height: 1.5;
      }
      nav {
        display: flex;
        gap: 16px;
        justify-content: center;
        align-items: center;
      }
      button {
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Each direct child is one page. Add, remove, or edit these articles. -->
    <main id="book" aria-label="My magazine">
      <article class="page cover">
        <h1>Your<br />magazine.</h1>
        <p>Edit this HTML.</p>
      </article>
      <article class="page">
        <h2>A first chapter.</h2>
        <p>Normal HTML and your own CSS. No page content in JavaScript.</p>
      </article>
      <article class="page">
        <h2>Make it yours.</h2>
        <p>Add headings, photographs, links, and layouts here.</p>
      </article>
      <article class="page cover">
        <h1>See you<br />soon.</h1>
        <p>The back cover.</p>
      </article>
    </main>
    <nav aria-label="Page navigation">
      <button id="prev">Previous</button
      ><span id="status" aria-live="polite"></span
      ><button id="next">Next</button>
    </nav>
    <script src="paper-curl.js"></script>
    <script>
      const book = new PaperCurl("#book", {
        width: 420,
        height: 594,
        duration: 1100,
        curl: 1.7,
        onChange: ({ spread, spreadCount }) => {
          document.querySelector("#status").textContent =
            `${spread + 1} / ${spreadCount}`;
          document.querySelector("#prev").disabled = spread === 0;
          document.querySelector("#next").disabled = spread === spreadCount - 1;
        },
      });
      document.querySelector("#prev").onclick = () => book.prev();
      document.querySelector("#next").onclick = () => book.next();
    </script>
  </body>
</html>
